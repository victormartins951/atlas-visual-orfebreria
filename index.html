<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atlas Visual de Orfebrería</title><style>body{background:#062b2b;color:#fff;font:18px system-ui;text-align:center;padding:12vh 2rem}p{color:#efd08b}</style></head><body><h1>Atlas Visual de Orfebrería</h1><p>Preparando la página...</p><script>(async()=>{try{const files=Array.from({length:27},(_,i)=>'site/part-'+String(i).padStart(2,'0')+'.txt');const parts=await Promise.all(files.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p+': '+r.status);return r.text()}));const content=parts.join('');document.open();document.write(content);document.close()}catch(e){document.body.innerHTML='<h1>No fue posible cargar la página</h1><p>Actualiza el navegador para intentarlo nuevamente.</p>';console.error(e)}})();</script></body></html>
